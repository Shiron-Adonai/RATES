name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']   # 8.1 = minimum in docs/TECHNICAL.md §4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, simplexml, mbstring
          coverage: none

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php -d error_reporting=-1 -d display_errors=1 tests/run.php

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check assets/js/app.js
