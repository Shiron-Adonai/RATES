; Rates Publisher overrides (loaded after php.ini-production)

; config.php max_upload_bytes is 5 MB; the daily file is about 60 KB
upload_max_filesize = 6M
post_max_size = 8M

display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; How long an idle result is kept (seconds). Sessions live in the container
; and are cleared when it is redeployed.
session.gc_maxlifetime = 3600
